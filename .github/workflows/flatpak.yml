name: Build Linux Flatpak Bundle

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: "Flatpak Bundle (Linux x86_64)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak and Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils

      - name: Setup Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak Runtimes
        run: |
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//46 org.gnome.Sdk//46 org.freedesktop.Sdk.Extension.rust-stable//23.08

      - name: Build Flatpak
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --user --install-deps-from=flathub --repo=repo build-dir packaging/flatpak/com.foxds.VoiceTranslator.yml

      - name: Create Flatpak Bundle (.flatpak)
        run: |
          flatpak build-bundle repo foxds-voice-translator.flatpak com.foxds.VoiceTranslator

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxds-voice-translator-flatpak
          path: foxds-voice-translator.flatpak

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "FoxDS Voice Translator Pro (Latest Linux Build)"
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ## 🐧 FoxDS Voice Translator Pro — Linux Flatpak Release
            
            Автономный пакет для любого дистрибутива Linux (Ubuntu, Debian, Fedora, Arch, Manjaro и др.).
            
            ### 📥 Быстрая установка:
            ```bash
            flatpak install --user foxds-voice-translator.flatpak
            ```
            
            ### 🎙️ Настройка виртуального микрофона для игр и Discord:
            ```bash
            flatpak run --command=setup-virtual-mic-linux.sh com.foxds.VoiceTranslator start
            ```
            
            ### 🚀 Запуск:
            ```bash
            flatpak run com.foxds.VoiceTranslator
            ```
          files: foxds-voice-translator.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

