[package]
name = "foxds_voice_translator"
version = "3.0.0"
edition = "2021"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls"] }
flacenc = "0.5"
hound = "3.5"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "wav", "flac"] }
tungstenite = { version = "0.26", default-features = false, features = ["native-tls", "handshake"] }
sha2 = "0.10"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation"
] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = false
debug = false
